name: runtime-ci

on:
  push:
    paths:
      - "src/wal_tat/runtime/**"
      - "tests/test_runtime_*.py"
      - "pyproject.toml"
      - ".github/workflows/runtime-ci.yml"
  pull_request:
    paths:
      - "src/wal_tat/runtime/**"
      - "tests/test_runtime_*.py"
      - "pyproject.toml"
      - ".github/workflows/runtime-ci.yml"
  workflow_dispatch:

jobs:
  portable-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install runtime and tests
        run: python -m pip install -e '.[runtime,test]'
      - name: Runtime unit tests
        run: pytest -q tests/test_runtime_cli.py tests/test_runtime_cache.py
      - name: CLI doctor
        run: wal-runtime doctor
      - name: Compile native CPU backend
        run: |
          python - <<'PY'
          from wal_tat.runtime.loader import development_module
          module = development_module("qwen_v77_direct_packed_native_cpu_runtime_v1")
          assert module is not None
          module.extension()
          print("native CPU extension compiled")
          PY
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
